name: Gerar lockfile Web seguro

on:
  push:
    branches:
      - feature/v0.2-transversal-foundation

permissions:
  contents: read

concurrency:
  group: gerar-lock-web-seguro
  cancel-in-progress: true

jobs:
  gerar:
    name: Resolver dependências corrigidas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Gerar package e lockfile candidatos sem dependências opcionais
        working-directory: apps/web
        run: |
          npm pkg delete overrides.sharp
          npm pkg set overrides.postcss=8.5.23
          npm install --package-lock-only --ignore-scripts --omit=optional --no-audit --no-fund
          npm audit --omit=dev --omit=optional --audit-level=high

      - name: Publicar arquivos candidatos
        uses: actions/upload-artifact@v7
        with:
          name: web-dependencies-no-optional-candidate
          path: |
            apps/web/package.json
            apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1
