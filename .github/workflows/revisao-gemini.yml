name: Revisao de Codigo com Gemini

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Executar Revisao do Gemini
        uses: google-github-actions/review-pull-request@v0
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
