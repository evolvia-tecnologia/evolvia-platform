name: QA E2E Evolvia - bootstrap e homologacao controlada

on:
  pull_request:
    branches:
      - claude/qa-e2e-acessibilidade
    paths:
      - "tests/e2e/**"
      - ".github/workflows/qa-e2e-acessibilidade.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL HTTPS de homologacao (hostname iniciando dev, homolog, homologacao ou staging)"
        required: true
        type: string
      executar_homologacao:
        description: "Confirmo execucao real em ambiente nao produtivo"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qa-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-dependencias:
    name: Instalar dependencias e gerar lockfile (NAO e teste E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar lockfile real a partir do registry npm
        working-directory: tests/e2e
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verificar lockfile versionado reproduzivel
        run: git diff --exit-code -- tests/e2e/package-lock.json
      - name: Instalar usando lockfile gerado
        working-directory: tests/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Listar testes sem executar navegador (NAO e homologacao)
        working-directory: tests/e2e
        env:
          EVOLVIA_E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          npx playwright test --list | tee /tmp/evolvia-e2e-lista.txt
          grep -Eq 'Total: [1-9][0-9]* tests? in [1-9][0-9]* files?' /tmp/evolvia-e2e-lista.txt
      - name: Publicar lockfile para revisao e commit posterior
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lockfile-${{ github.run_id }}
          path: tests/e2e/package-lock.json
          if-no-files-found: error
          retention-days: 7

  homologacao-real:
    name: Playwright + axe em homologacao (somente acionamento explicito)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.executar_homologacao == true }}
    needs: bootstrap-dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: homologacao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exigir lockfile versionado, ambiente seguro e fixtures completas
        env:
          EVOLVIA_E2E_BASE_URL: ${{ inputs.base_url }}
          EVOLVIA_E2E_ALLOWED_HOSTS: ${{ vars.EVOLVIA_E2E_ALLOWED_HOSTS }}
          EVOLVIA_E2E_EMAIL: ${{ secrets.EVOLVIA_E2E_EMAIL }}
          EVOLVIA_E2E_SENHA: ${{ secrets.EVOLVIA_E2E_SENHA }}
          EVOLVIA_E2E_EVENTO_ID: ${{ vars.EVOLVIA_E2E_EVENTO_ID }}
          EVOLVIA_E2E_EVENTO_SLUG: ${{ vars.EVOLVIA_E2E_EVENTO_SLUG }}
          EVOLVIA_E2E_EVENTO_SLUG_PAGO: ${{ vars.EVOLVIA_E2E_EVENTO_SLUG_PAGO }}
        run: |
          test -s tests/e2e/package-lock.json || { echo "::error::package-lock.json nao versionado"; exit 1; }
          node - <<'NODE'
          const keys = ['EVOLVIA_E2E_BASE_URL','EVOLVIA_E2E_EMAIL','EVOLVIA_E2E_SENHA','EVOLVIA_E2E_EVENTO_ID','EVOLVIA_E2E_EVENTO_SLUG','EVOLVIA_E2E_EVENTO_SLUG_PAGO'];
          const missing = keys.filter((key) => !process.env[key]);
          if (missing.length) { console.error('::error::Fixtures/segredos ausentes: ' + missing.join(', ')); process.exit(1); }
          let url;
          try { url = new URL(process.env.EVOLVIA_E2E_BASE_URL); }
          catch { console.error('::error::URL de homologacao invalida'); process.exit(1); }
          const allowed = (process.env.EVOLVIA_E2E_ALLOWED_HOSTS || 'dev.evolviatecnologia.com,homolog.evolviatecnologia.com,homologacao.evolviatecnologia.com,staging.evolviatecnologia.com')
            .split(',').map((host) => host.trim().toLowerCase()).filter(Boolean);
          if (url.protocol !== 'https:' || !allowed.includes(url.hostname.toLowerCase()) || url.username || url.password) {
            console.error('::error::URL recusada: HTTPS e hostname explicitamente permitido sao obrigatorios'); process.exit(1);
          }
          NODE
      - name: Instalar dependencias reproduziveis
        working-directory: tests/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar navegadores reais
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Executar E2E e axe
        working-directory: tests/e2e
        env:
          EVOLVIA_E2E_BASE_URL: ${{ inputs.base_url }}
          EVOLVIA_E2E_EMAIL: ${{ secrets.EVOLVIA_E2E_EMAIL }}
          EVOLVIA_E2E_SENHA: ${{ secrets.EVOLVIA_E2E_SENHA }}
          EVOLVIA_E2E_EVENTO_ID: ${{ vars.EVOLVIA_E2E_EVENTO_ID }}
          EVOLVIA_E2E_EVENTO_SLUG: ${{ vars.EVOLVIA_E2E_EVENTO_SLUG }}
          EVOLVIA_E2E_EVENTO_SLUG_PAGO: ${{ vars.EVOLVIA_E2E_EVENTO_SLUG_PAGO }}
        run: npx playwright test
      - name: Rejeitar suite vazia ou com skips
        working-directory: tests/e2e
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('resultados.json')) { console.error('::error::Relatorio Playwright ausente'); process.exit(1); }
          const report = JSON.parse(fs.readFileSync('resultados.json', 'utf8'));
          const stats = report.stats || {};
          console.log('Resumo E2E:', JSON.stringify(stats));
          if (!stats.expected || stats.skipped || stats.unexpected || stats.flaky) {
            console.error('::error::E2E incompleto: zero testes, skips, falhas ou instabilidade');
            process.exit(1);
          }
          NODE
      - name: Resumo sanitizado (sem traces, videos ou capturas de login)
        if: always()
        working-directory: tests/e2e
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = fs.existsSync('resultados.json')
            ? JSON.parse(fs.readFileSync('resultados.json', 'utf8')) : {};
          const stats = report.stats || {};
          const safe = {
            sha: process.env.GITHUB_SHA,
            expected: stats.expected ?? 0,
            unexpected: stats.unexpected ?? 0,
            skipped: stats.skipped ?? 0,
            flaky: stats.flaky ?? 0,
            durationMs: stats.duration ?? null,
            complete: Boolean(stats.expected && !stats.unexpected && !stats.skipped && !stats.flaky),
          };
          fs.writeFileSync('e2e-summary.json', JSON.stringify(safe, null, 2) + '\\n');
          NODE
      - name: Publicar somente resumo sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resumo-${{ github.run_id }}
          path: tests/e2e/e2e-summary.json
          if-no-files-found: warn
          retention-days: 7
