name: Validação da Evolvia v0.2

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: evolvia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencias_web_candidatas:
    name: Gerar correção candidata das dependências Web
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Gerar lockfile mínimo sem dependências opcionais
        working-directory: apps/web
        run: |
          npm pkg delete overrides.sharp
          npm pkg set overrides.postcss=8.5.23
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'EOF_NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package-lock.json';
          const lock = JSON.parse(await readFile(path, 'utf8'));
          for (const [name, metadata] of Object.entries(lock.packages ?? {})) {
            if (name && metadata?.optional === true) delete lock.packages[name];
          }
          await writeFile(path, `${JSON.stringify(lock, null, 2)}\n`);
          EOF_NODE
          rm -rf node_modules
          npm ci --omit=optional --no-audit --no-fund
          npm audit --omit=dev --omit=optional --audit-level=high
          npm run typecheck
          npm run build

      - name: Publicar arquivos candidatos
        uses: actions/upload-artifact@v7
        with:
          name: web-dependencies-minimal-candidate
          path: |
            apps/web/package.json
            apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1

  qualidade:
    name: Qualidade, tipos, segurança e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Validar API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://evolvia:evolvia@127.0.0.1:5432/evolvia?schema=public
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run prisma:validate
          npm run prisma:generate
          npm run typecheck
          npm run build
          npm run test:unit

      - name: Validar Web
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run build

  arm64:
    name: Build ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: qualidade

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar emulação ARM64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir API para ARM64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --load \
            --tag evolvia-api:ci-arm64 \
            apps/api

      - name: Construir Web para ARM64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --load \
            --tag evolvia-web:ci-arm64 \
            apps/web

      - name: Confirmar arquitetura das imagens
        run: |
          test "$(docker image inspect evolvia-api:ci-arm64 --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect evolvia-web:ci-arm64 --format '{{.Architecture}}')" = "arm64"

  integracao:
    name: Migration e integração
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: qualidade
    env:
      COMPOSE_PROJECT_NAME: evolvia-ci-${{ github.run_id }}
      POSTGRES_DB: evolvia_ci
      POSTGRES_USER: evolvia_ci
      POSTGRES_PASSWORD: evolvia_ci_password
      JWT_SECRET: evolvia_ci_jwt_secret_with_more_than_32_characters
      API_HOST_PORT: "4000"
      WEB_HOST_PORT: "3000"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Validar o Docker Compose
        run: |
          cat > .env.ci <<EOF_ENV
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          API_HOST_PORT=${API_HOST_PORT}
          WEB_HOST_PORT=${WEB_HOST_PORT}
          EOF_ENV
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            config -q

      - name: Construir e iniciar o ambiente descartável
        run: |
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            up -d --build

      - name: Aguardar os serviços
        run: |
          for tentativa in $(seq 1 80); do
            if curl -fsS --max-time 5 http://127.0.0.1:4000/health >/dev/null \
              && curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Os serviços não ficaram saudáveis no prazo esperado."
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            ps --all
          exit 1

      - name: Executar o fluxo funcional
        env:
          EVOLVIA_API_URL: http://127.0.0.1:4000
        run: node scripts/ci-smoke-v02.mjs

      - name: Confirmar migration idempotente
        run: |
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            run --rm migrate | tee migrate-segunda-execucao.log
          grep -q "No pending migrations to apply" migrate-segunda-execucao.log

      - name: Exibir logs em caso de falha
        if: failure()
        run: |
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            ps --all || true
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            logs --no-color || true

      - name: Remover o ambiente descartável
        if: always()
        run: |
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            down -v --remove-orphans || true
          rm -f .env.ci migrate-segunda-execucao.log

  homologacao:
    name: Publicar homologação
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - qualidade
      - arm64
      - integracao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Preparar a chave SSH restrita
        shell: bash
        env:
          EVOLVIA_SSH_KEY: ${{ secrets.EVOLVIA_STAGING_SSH_KEY }}
          EVOLVIA_KNOWN_HOSTS: ${{ secrets.EVOLVIA_STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$EVOLVIA_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/evolvia_staging"
          chmod 600 "$HOME/.ssh/evolvia_staging"
          printf '%s' "$EVOLVIA_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publicar a homologação com rollback
        run: |
          ssh \
            -i "$HOME/.ssh/evolvia_staging" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@64.181.174.36 \
            "deploy $GITHUB_SHA"
