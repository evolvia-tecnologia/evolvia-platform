name: Validação da Evolvia v0.2

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolvia-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Runs de PR substituídas podem ser canceladas; pushes/deploys nunca são interrompidos.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    name: Qualidade, tipos, segurança e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Validar contratos operacionais
        run: |
          node scripts/validate-readiness-contract.mjs
          npm run validate:gate1-human-evidence
          node --test scripts/validate-gate1-human-accessibility-evidence.test.mjs

      - name: Validar API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://evolvia:evolvia@127.0.0.1:5432/evolvia?schema=public
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run prisma:validate
          npm run prisma:generate
          npm run typecheck
          npm run build
          npm run test:unit

      - name: Validar Web
        working-directory: apps/web
        run: |
          npm ci --omit=optional --no-audit --no-fund
          npm audit --omit=dev --omit=optional --audit-level=high
          npm run typecheck
          npm run test:unit
          npm run build

  detectar_mudancas_arm64:
    name: Detectar imagens afetadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filtro.outputs.api }}
      web: ${{ steps.filtro.outputs.web }}

    steps:
      - name: Baixar o código com histórico do PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classificar imagens afetadas
        id: filtro
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail

          classificar_arquivos() {
            local api=false
            local web=false
            local arquivo

            while IFS= read -r arquivo; do
              case "$arquivo" in
                apps/api/*)
                  api=true
                  ;;
                apps/web/*)
                  web=true
                  ;;
                .github/workflows/validacao-v02.yml)
                  # A própria mudança do Gate precisa provar as duas imagens.
                  api=true
                  web=true
                  ;;
              esac
            done

            printf '%s %s\n' "$api" "$web"
          }

          # Matriz determinística do filtro: evita economizar à custa de cobertura.
          test "$(printf '%s\n' 'apps/api/src/main.ts' | classificar_arquivos)" = "true false"
          test "$(printf '%s\n' 'apps/web/app/page.tsx' | classificar_arquivos)" = "false true"
          test "$(printf '%s\n' 'apps/api/src/main.ts' 'apps/web/app/page.tsx' | classificar_arquivos)" = "true true"
          test "$(printf '%s\n' '.github/workflows/validacao-v02.yml' | classificar_arquivos)" = "true true"
          test "$(printf '%s\n' 'docs/governance/README.md' | classificar_arquivos)" = "false false"
          echo "Matriz de classificação ARM64 validada."

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            # Pushes de develop/main preservam o Gate integral antes do deploy.
            api=true
            web=true
          else
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > /tmp/evolvia-arquivos-alterados.txt
            read -r api web < <(classificar_arquivos < /tmp/evolvia-arquivos-alterados.txt)
          fi

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "ARM64 API necessário: $api"
          echo "ARM64 Web necessário: $web"

  arm64_api:
    name: Build ARM64 — API
    if: ${{ needs.detectar_mudancas_arm64.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs:
      - qualidade
      - detectar_mudancas_arm64

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar emulação ARM64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Preparar Docker Buildx com baixa concorrência
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Construir e validar API para ARM64
        shell: bash
        run: |
          set -Eeuo pipefail

          construir_api() {
            timeout --signal=TERM --kill-after=30s 22m \
              docker buildx build \
                --platform linux/arm64 \
                --provenance=false \
                --progress=plain \
                --load \
                --tag evolvia-api:ci-arm64 \
                apps/api
          }

          for tentativa in 1 2; do
            if construir_api; then
              test "$(docker image inspect evolvia-api:ci-arm64 --format '{{.Architecture}}')" = "arm64"
              exit 0
            fi

            if [[ "$tentativa" -eq 2 ]]; then
              echo "A imagem ARM64 da API falhou após duas tentativas controladas."
              exit 1
            fi

            echo "::warning::Falha ou travamento transitório na emulação ARM64 da API. Nova tentativa controlada: 2/2."
            sleep 15
          done

  arm64_web:
    name: Build ARM64 — Web
    if: ${{ needs.detectar_mudancas_arm64.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs:
      - qualidade
      - detectar_mudancas_arm64

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar emulação ARM64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Preparar Docker Buildx com baixa concorrência
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Construir e validar Web para ARM64
        shell: bash
        run: |
          set -Eeuo pipefail

          construir_web() {
            timeout --signal=TERM --kill-after=30s 22m \
              docker buildx build \
                --platform linux/arm64 \
                --provenance=false \
                --progress=plain \
                --load \
                --tag evolvia-web:ci-arm64 \
                apps/web
          }

          for tentativa in 1 2; do
            if construir_web; then
              test "$(docker image inspect evolvia-web:ci-arm64 --format '{{.Architecture}}')" = "arm64"
              exit 0
            fi

            if [[ "$tentativa" -eq 2 ]]; then
              echo "A imagem ARM64 da Web falhou após duas tentativas controladas."
              exit 1
            fi

            echo "::warning::Falha ou travamento transitório na emulação ARM64 da Web. Nova tentativa controlada: 2/2."
            sleep 15
          done

  arm64:
    name: Build ARM64
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - qualidade
      - detectar_mudancas_arm64
      - arm64_api
      - arm64_web

    steps:
      - name: Consolidar Gate ARM64 verificável
        shell: bash
        env:
          QUALIDADE_RESULT: ${{ needs.qualidade.result }}
          DETECCAO_RESULT: ${{ needs.detectar_mudancas_arm64.result }}
          API_NECESSARIA: ${{ needs.detectar_mudancas_arm64.outputs.api }}
          WEB_NECESSARIA: ${{ needs.detectar_mudancas_arm64.outputs.web }}
          API_RESULT: ${{ needs.arm64_api.result }}
          WEB_RESULT: ${{ needs.arm64_web.result }}
        run: |
          set -Eeuo pipefail

          test "$QUALIDADE_RESULT" = "success"
          test "$DETECCAO_RESULT" = "success"

          if [[ "$API_NECESSARIA" == "true" ]]; then
            test "$API_RESULT" = "success"
          else
            test "$API_RESULT" = "skipped"
            echo "API ARM64 corretamente ignorada: imagem não afetada."
          fi

          if [[ "$WEB_NECESSARIA" == "true" ]]; then
            test "$WEB_RESULT" = "success"
          else
            test "$WEB_RESULT" = "skipped"
            echo "Web ARM64 corretamente ignorada: imagem não afetada."
          fi

          echo "Gate ARM64 concluído sem reduzir a cobertura aplicável."

  integracao:
    name: Migration e integração
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - qualidade
      - detectar_mudancas_arm64
    env:
      COMPOSE_PROJECT_NAME: evolvia-ci-${{ github.run_id }}
      POSTGRES_DB: evolvia_ci
      POSTGRES_USER: evolvia_ci
      POSTGRES_PASSWORD: evolvia_ci_password
      JWT_SECRET: evolvia_ci_jwt_secret_with_more_than_32_characters
      API_HOST_PORT: "4000"
      WEB_HOST_PORT: "3000"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Validar o Docker Compose
        run: |
          cat > .env.ci <<EOF_ENV
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          API_HOST_PORT=${API_HOST_PORT}
          WEB_HOST_PORT=${WEB_HOST_PORT}
          EOF_ENV
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            config -q

      - name: Construir e iniciar o ambiente descartável
        run: |
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            up -d --build

      - name: Aguardar os serviços
        run: |
          for tentativa in $(seq 1 80); do
            if curl -fsS --max-time 5 http://127.0.0.1:4000/health/ready >/dev/null \
              && curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Os serviços não ficaram saudáveis no prazo esperado."
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            ps --all
          exit 1

      - name: Executar o fluxo funcional
        env:
          EVOLVIA_API_URL: http://127.0.0.1:4000
        run: |
          node scripts/ci-smoke-v02.mjs
          node scripts/ci-smoke-a4.mjs
          node scripts/ci-smoke-a5.mjs
          node scripts/ci-smoke-a6.mjs

      - name: Capturar evidência visual de /eventos
        if: ${{ needs.detectar_mudancas_arm64.outputs.web == 'true' }}
        env:
          EVOLVIA_WEB_URL: http://127.0.0.1:3000
          EVOLVIA_VISUAL_OUTPUT: visual-evidence
        run: node scripts/capture-events-visual-evidence.mjs

      - name: Preservar evidência visual da branch
        if: ${{ needs.detectar_mudancas_arm64.outputs.web == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: eventos-visual-${{ github.sha }}
          path: visual-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Confirmar migration idempotente
        run: |
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            run --rm migrate | tee migrate-segunda-execucao.log
          grep -q "No pending migrations to apply" migrate-segunda-execucao.log

      - name: Provar acessibilidade runtime das rotas públicas
        if: ${{ needs.detectar_mudancas_arm64.outputs.web == 'true' }}
        env:
          EVOLVIA_WEB_URL: http://127.0.0.1:3000
          EVOLVIA_A11Y_OUTPUT: visual-evidence/public-accessibility-runtime.json
        run: |
          node --test scripts/validate-public-accessibility-runtime.test.mjs
          node scripts/validate-public-accessibility-runtime.mjs

      - name: Preservar evidência de acessibilidade runtime
        if: ${{ always() && needs.detectar_mudancas_arm64.outputs.web == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: acessibilidade-runtime-${{ github.sha }}
          path: visual-evidence/public-accessibility-runtime.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Provar espaçamento de texto das rotas públicas
        if: ${{ needs.detectar_mudancas_arm64.outputs.web == 'true' }}
        env:
          EVOLVIA_WEB_URL: http://127.0.0.1:3000
          EVOLVIA_TEXT_SPACING_OUTPUT: visual-evidence/public-text-spacing-runtime.json
        run: |
          node --test scripts/validate-public-text-spacing.test.mjs
          node scripts/validate-public-text-spacing.mjs

      - name: Preservar evidência de espaçamento de texto
        if: ${{ always() && needs.detectar_mudancas_arm64.outputs.web == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: acessibilidade-text-spacing-${{ github.sha }}
          path: visual-evidence/public-text-spacing-runtime.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Provar árvore acessível das rotas públicas
        if: ${{ needs.detectar_mudancas_arm64.outputs.web == 'true' }}
        env:
          EVOLVIA_WEB_URL: http://127.0.0.1:3000
          EVOLVIA_AX_OUTPUT: visual-evidence/public-accessibility-tree.json
        run: |
          node --test scripts/validate-public-accessibility-tree.mjs
          node scripts/validate-public-accessibility-tree.mjs

      - name: Preservar evidência da árvore acessível
        if: ${{ always() && needs.detectar_mudancas_arm64.outputs.web == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: acessibilidade-ax-${{ github.sha }}
          path: visual-evidence/public-accessibility-tree.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Exibir logs em caso de falha
        if: failure()
        run: |
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            ps --all || true
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            logs --no-color || true

      - name: Remover o ambiente descartável
        if: always()
        run: |
          docker compose \
            --env-file .env.ci \
            -p "$COMPOSE_PROJECT_NAME" \
            down -v --remove-orphans || true
          rm -f .env.ci migrate-segunda-execucao.log

  homologacao:
    name: Publicar homologação
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - qualidade
      - arm64
      - integracao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Baixar a configuração versionada
        uses: actions/checkout@v6

      - name: Preparar a chave SSH restrita
        shell: bash
        env:
          EVOLVIA_SSH_KEY: ${{ secrets.EVOLVIA_STAGING_SSH_KEY }}
          EVOLVIA_KNOWN_HOSTS: ${{ secrets.EVOLVIA_STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$EVOLVIA_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/evolvia_staging"
          chmod 600 "$HOME/.ssh/evolvia_staging"
          printf '%s' "$EVOLVIA_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publicar a homologação com rollback
        run: |
          ssh \
            -i "$HOME/.ssh/evolvia_staging" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@64.181.174.36 \
            "deploy $GITHUB_SHA"

      - name: Comprovar domínio público e HTTPS
        shell: bash
        env:
          HOMOLOGATION_URL: https://homologacao.evolviatecnologia.com
        run: |
          set -Eeuo pipefail

          for tentativa in $(seq 1 12); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --head \
              --max-time 10 \
              --retry 2 \
              --retry-delay 2 \
              "$HOMOLOGATION_URL/" >/tmp/evolvia-https-headers.txt; then
              break
            fi

            if [[ "$tentativa" -eq 12 ]]; then
              echo "HTTPS público não ficou disponível após o deploy."
              exit 1
            fi
            sleep 5
          done

          tr -d '\r' </tmp/evolvia-https-headers.txt >/tmp/evolvia-https-headers-normalizados.txt
          validacao_falhou=0

          registrar_erro() {
            local titulo="$1"
            local detalhe="$2"
            echo "::error title=${titulo}::${detalhe}"
            validacao_falhou=1
          }

          readiness_payload="$(curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            --retry 2 \
            --retry-delay 2 \
            "$HOMOLOGATION_URL/api/health/ready" || true)"

          if grep -Eiq '"status"[[:space:]]*:[[:space:]]*"ready"' <<<"$readiness_payload" \
            && grep -Eiq '"service"[[:space:]]*:[[:space:]]*"evolvia-api"' <<<"$readiness_payload" \
            && grep -Eiq '"database"[[:space:]]*:[[:space:]]*"ok"' <<<"$readiness_payload"; then
            echo "Readiness público comprovado: API e PostgreSQL prontos."
          else
            registrar_erro \
              "Readiness público ausente ou divergente" \
              "A rota /api/health/ready não comprovou API e PostgreSQL prontos."
          fi

          exigir_cabecalho() {
            local nome="$1"
            local rotulo="$2"
            local expressao="$3"
            local observado

            if grep -Eiq "$expressao" /tmp/evolvia-https-headers-normalizados.txt; then
              echo "Cabeçalho HTTPS comprovado: ${rotulo}."
              return
            fi

            observado="$(grep -Ei "^${nome}:" /tmp/evolvia-https-headers-normalizados.txt | head -1 || true)"
            if [[ -z "$observado" ]]; then
              observado="${nome}: ausente"
            fi
            registrar_erro \
              "Cabeçalho HTTPS ausente ou divergente" \
              "${rotulo} não atende ao contrato público (${observado})."
          }

          https_status="$(awk '/^HTTP\/[0-9.]+ / { status=$2 } END { print status }' /tmp/evolvia-https-headers-normalizados.txt)"
          case "$https_status" in
            200|204|301|302|307|308)
              echo "Status HTTPS comprovado: ${https_status}."
              ;;
            *)
              registrar_erro \
                "Status HTTPS inesperado" \
                "Resposta final recebida: ${https_status:-ausente}."
              ;;
          esac

          exigir_cabecalho \
            "strict-transport-security" \
            "HSTS com max-age de 31536000" \
            '^strict-transport-security: .*max-age=31536000'
          exigir_cabecalho \
            "x-content-type-options" \
            "X-Content-Type-Options nosniff" \
            '^x-content-type-options: nosniff$'
          exigir_cabecalho \
            "referrer-policy" \
            "Referrer-Policy estrita" \
            '^referrer-policy: strict-origin-when-cross-origin$'
          exigir_cabecalho \
            "x-frame-options" \
            "X-Frame-Options SAMEORIGIN" \
            '^x-frame-options: sameorigin$'

          if grep -Eiq '^x-powered-by:' /tmp/evolvia-https-headers-normalizados.txt; then
            observado="$(grep -Ei '^x-powered-by:' /tmp/evolvia-https-headers-normalizados.txt | head -1)"
            registrar_erro \
              "Tecnologia Web exposta" \
              "O cabeçalho público não pode expor X-Powered-By (${observado})."
          else
            echo "Ocultação tecnológica Web comprovada."
          fi

          if grep -Eiq '^server: nginx/[0-9]' /tmp/evolvia-https-headers-normalizados.txt; then
            observado="$(grep -Ei '^server:' /tmp/evolvia-https-headers-normalizados.txt | head -1)"
            registrar_erro \
              "Versão do proxy exposta" \
              "O cabeçalho Server não pode expor a versão do Nginx (${observado})."
          else
            echo "Ocultação da versão do proxy comprovada."
          fi

          http_code="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 10 \
            http://homologacao.evolviatecnologia.com/)"

          redirect_url="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{redirect_url}' \
            --max-time 10 \
            http://homologacao.evolviatecnologia.com/)"

          if [[ "$http_code" != "301" && "$http_code" != "308" ]]; then
            registrar_erro \
              "Status HTTP sem redirecionamento permanente" \
              "Esperado 301 ou 308; recebido ${http_code:-ausente}."
          else
            echo "Status HTTP de redirecionamento comprovado: ${http_code}."
          fi

          case "$redirect_url" in
            https://homologacao.evolviatecnologia.com/*)
              echo "Destino HTTPS comprovado: ${redirect_url}."
              ;;
            *)
              registrar_erro \
                "Redirecionamento HTTP inesperado" \
                "Destino recebido: ${redirect_url:-ausente}."
              ;;
          esac

          if [[ "$validacao_falhou" -ne 0 ]]; then
            exit 1
          fi

          echo "Homologação pública comprovada em ${HOMOLOGATION_URL}."

  homologacao_status:
    name: Registrar evidência da homologação
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs:
      - homologacao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publicar status verificável no SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOMOLOGACAO_RESULT: ${{ needs.homologacao.result }}
        run: |
          set -Eeuo pipefail

          if [[ "$HOMOLOGACAO_RESULT" == "success" ]]; then
            state="success"
            description="Homologação e HTTPS público comprovados"
          else
            state="failure"
            description="Homologação/HTTPS não comprovados: ${HOMOLOGACAO_RESULT}"
          fi

          payload=$(printf '{"state":"%s","context":"evolvia/homologacao","description":"%s","target_url":"https://github.com/%s/actions/runs/%s"}' \
            "$state" "$description" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
