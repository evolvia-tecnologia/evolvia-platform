name: QA result guard regression

on:
  pull_request:
    paths:
      - 'tools/verificar-resultado.mjs'
      - 'tools/verificar-resultado.test.mjs'
      - 'package.json'
      - '.github/workflows/qa-result-guard.yml'
  push:
    branches:
      - 'codex/qa-foundation-handoff-20261104'
    paths:
      - 'tools/verificar-resultado.mjs'
      - 'tools/verificar-resultado.test.mjs'
      - 'package.json'
      - '.github/workflows/qa-result-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: QA result guard regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Playwright JSON verdict guard regression
        run: npm run test:qa-result-guard
