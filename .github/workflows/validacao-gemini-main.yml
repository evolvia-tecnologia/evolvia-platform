name: Validação controlada do Gemini em main

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/gemini-developer.yml'
      - '.github/workflows/validacao-gemini-main.yml'
      - '.github/actions/gemini-cli-safe/action.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gemini-developer.yml'
      - '.github/workflows/validacao-gemini-main.yml'
      - '.github/actions/gemini-cli-safe/action.yml'

permissions:
  contents: read

jobs:
  validar:
    name: Qualidade, tipos, segurança e build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
      - name: Validar contrato de segurança do piloto
        shell: bash
        run: |
          set -Eeuo pipefail
          arquivo=.github/workflows/gemini-developer.yml
          test -f "$arquivo"
          grep -Fq "issue_comment:" "$arquivo"
          grep -Fq "@gemini-dev /plan" "$arquivo"
          grep -Fq "@gemini-dev /approve" "$arquivo"
          grep -Fq "id: gemini_plan" "$arquivo"
          grep -Fq "steps.gemini_plan.outputs.summary" "$arquivo"
          if grep -Fq "steps.gemini_plan.outputs.gemini_response" "$arquivo"; then
            echo "Saída interna inválida do Gemini encontrada; use o contrato público outputs.summary."
            exit 1
          fi
          grep -Fq "Validar e publicar plano verificável" "$arquivo"
          grep -Fq "gh api --method POST" "$arquivo"
          grep -Fq "Resposta recusada: cabeçalho obrigatório ausente." "$arquivo"
          test "$(grep -Fc '"add_issue_comment",' "$arquivo")" -eq 1
          executor=.github/actions/gemini-cli-safe/action.yml
          test -f "$executor"
          test "$(grep -Fc "uses: ./.workflow-control/.github/actions/gemini-cli-safe" "$arquivo")" -eq 2
          test "$(grep -Fc "github.workflow_sha" "$arquivo")" -eq 2
          if grep -Fq "google-github-actions/run-gemini-cli@" "$arquivo"; then
            echo "Action upstream vulnerável não pode ser usada pelo piloto."
            exit 1
          fi
          grep -Fq "openssl rand -hex 16" "$executor"
          grep -Fq "gemini_response<<" "$executor"
          if grep -Fq "gemini_response<<EOF" "$executor"; then
            echo "Delimitador fixo vulnerável encontrado."
            exit 1
          fi
          grep -Fq "cota 429" "$executor"
          grep -Fq "indisponibilidade 503 após retentativas limitadas" "$executor"
          grep -Fq "A próxima ativação poderá reavaliar a disponibilidade" "$executor"
          if grep -Eq '(^|[[:space:]])eval([[:space:]]|$)' "$executor"; then
            echo "Uso inseguro de eval encontrado."
            exit 1
          fi
          test "$(grep -Ec '^[[:space:]]+ref:[[:space:]]+develop$' "$arquivo")" -eq 2
          test "$(grep -Fc "persist-credentials: 'false'" "$arquivo")" -eq 2
          for proibido in delete_file fork_repository merge_pull_request "actions: write" "deployments: write" "environments: write"; do
            if grep -Fq "$proibido" "$arquivo"; then
              echo "Permissão proibida encontrada: $proibido"
              exit 1
            fi
          done
          echo "Contrato do Gemini Developer aprovado para ativação em main."
