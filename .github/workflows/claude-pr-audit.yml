name: Claude API — PR audit
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Existing PR to audit (read-only)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: claude-api-audit-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate PR number
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,5}$ ]] || exit 1
      - name: Audit with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          AUDIT_PR: ${{ inputs.pr_number }}
          ANTHROPIC_MODEL: claude-sonnet-4-5
        run: python3 scripts/claude-pr-audit.py
